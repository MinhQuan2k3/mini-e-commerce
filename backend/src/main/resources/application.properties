spring.application.name=backend

# ===== Server =====
server.port=8080

# ===== Database (MySQL) =====
# Giá tr? l?y t? bi?n môi tr??ng. Ph?n sau d?u ":" là giá tr? m?c ??nh n?u không set bi?n.
# KHÔNG ghi m?t kh?u th?t vào file này (file này ???c commit lên Git).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mini_ecommerce}
spring.datasource.username=${DB_USERNAME:mini_ecommerce_app}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
# none: Hibernate KHÔNG t? t?o/s?a b?ng. B?ng ???c t?o b?ng SQL script.
spring.jpa.hibernate.ddl-auto=none
# In câu SQL ra log ?? d? h?c/debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false