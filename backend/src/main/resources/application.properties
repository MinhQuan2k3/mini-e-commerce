spring.application.name=backend

# ===== Server =====
server.port=8080

# ===== Database (MySQL) =====
# Values come from environment variables.
# Defaults are provided for URL and username only.
# Never commit real passwords.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mini_ecommerce}
spring.datasource.username=${DB_USERNAME:mini_ecommerce_app}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
# Hibernate does not create or modify database tables.
spring.jpa.hibernate.ddl-auto=none

# SQL logging for development.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false